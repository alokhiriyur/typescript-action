name: Demo CICD Multi-Stage Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Dev Stage
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: dev
    secrets: inherit

  deploy-uat:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-dev
    name: UAT Stage
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: uat
    secrets: inherit

  deploy-prod:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-uat
    name: Prod Stage
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: prod
    secrets: inherit
