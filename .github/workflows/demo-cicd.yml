# .github/workflows/demo-cicd.yml
name: Demo CICD Multi-Stage Deployment

on:
  workflow_run:
    workflows:
      - "Demo CI Pipeline"
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Dev Stage
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: dev
    secrets: inherit

  deploy-uat:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: UAT Stage
    needs: deploy-dev
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: uat
    secrets: inherit

  deploy-prod:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Prod Stage
    needs: deploy-uat
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment-name: prod
    secrets: inherit
