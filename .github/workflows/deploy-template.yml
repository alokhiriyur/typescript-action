name: Shared Deployment Blueprint

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string
        description: "The targeted GitHub environment name (e.g. dev, uat, prod)"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment-name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Verify build artifact exists
        run: test -f dist/index.js

      - name: Copy build files to Windows VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: "dist/**,package.json,package-lock.json"
          target: "C:/apps/alok"

      - name: Install prod dependencies and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "
              Set-Location 'C:\apps\my-ts-app-100';
              if (!(Test-Path 'node_modules')) {
                npm ci --omit=dev
              } else {
                npm ci --omit=dev
              }

              if (Get-Process pm2 -ErrorAction SilentlyContinue) {
                pm2 restart my-ts-app
              } else {
                pm2 start dist/index.js --name my-ts-app
              }

              pm2 save
            "
